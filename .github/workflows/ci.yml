name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro)
        run: npm run check

      - name: Build (astro)
        run: npm run build

      # check-csp solo ve las prerenderizadas en dist/client: los scripts inline de páginas
      # SSR (hoy la intro de la home) exigen servir el build. El preview arranca, se cuela
      # por las URLs API-free (/ y /favoritos no fetchean nada server-side) y el check
      # valida prerenderizadas + SSR de verdad.
      - name: Verify CSP hashes (prerender + SSR via preview)
        run: |
          nohup npm run preview > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:4321/ > /dev/null; then
              node scripts/check-csp.mjs http://localhost:4321/ http://localhost:4321/favoritos
              exit 0
            fi
            sleep 2
          done
          echo "::error::El preview del build no arrancó en 60 s"
          cat preview.log
          exit 1

      - name: Verify legal twins (ES/EN)
        run: node scripts/check-legal-twins.mjs

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy (wrangler)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en el repositorio (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          npm run build
          nohup npm run preview > preview.log 2>&1 &
          preview_ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:4321/ > /dev/null; then
              preview_ok=1
              break
            fi
            sleep 2
          done
          if [ "$preview_ok" -ne 1 ]; then
            echo "::error::El preview del build no arrancó en 60 s: CSP de SSR sin verificar, no se despliega"
            cat preview.log
            exit 1
          fi
          node scripts/check-csp.mjs http://localhost:4321/ http://localhost:4321/favoritos
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Sin smoke remoto: workers.dev está desactivado en wrangler.jsonc (origin alternativo
      # que esquivaba las protecciones anti-bots de la zone) y www.madmovil.es desafía a los
      # runners de GitHub, así que no hay URL alcanzable desde el CI. El deploy falla si
      # wrangler falla; build/check/CSP ya gatean el resto.
